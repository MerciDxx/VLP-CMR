# datasets
datasets: PointDA
data_dir: /data1/dengxuxiang/datasets/PointDA_data
tgt_multi_view: False
# src_domain: Synthetic
# tgt_domain: target_train.txt    建议通过auto run里面的任务来输入

# Backbone
model_name: VIT-B

# FixMatch
fixmatch: False
use_amp: True

# Optimizer related
lr: 1e-4
weight_decay: 1e-4
momentum: 0.9
label_smoothing: 0.1
l_batch_size: 32
u_batch_size: 32

# Loss related
lambda1: 1.0
lambda2: 0.5
lambda3: 0.1

# scheduler related
scheduler: True
lr_gamma: 0.0003
lr_decay: 0.75
multiple_lr_classifier: 1000

# Training related
n_iter_per_epoch: 200
n_epoch: 100

# Others
seed: 42
num_workers: 4

# Multi-view selection related
mv_select_mode: "MV_CLIP"
top_k: 4
use_mean_text_score: True